<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A chef's toque knocked out of a disc. Three lobes, each bulging past its
       own peak so the crown swells rather than curving flat, over a band that
       the crown overhangs on both sides. The crown/band seam is a real hole
       (fill-rule evenodd) rather than a rect painted in an assumed background
       colour, so it always shows the disc beneath it. Both palettes travel in
       the file: terracotta on a light browser, warm coral on a dark one. -->
  <style>
    :root { --chip: #8f2f21; --mark: #faf7f2; }
    @media (prefers-color-scheme: dark) {
      :root { --chip: #e2795f; --mark: #1c1a17; }
    }
  </style>
  <circle cx="16" cy="16" r="15.5" fill="var(--chip)" />
  <g transform="translate(16 16.5) scale(0.74) translate(-16 -16.5)">
    <path fill="var(--mark)" fill-rule="evenodd" d="M3.4 21.5C2.5 19.2 2 16.8 2.2 14C2.5 8.8 4.6 5.6 7.6 5.6C10.4 5.6 11.3 8 11.7 10.4C12.1 6.4 13.5 2 16 2C18.5 2 19.9 6.4 20.3 10.4C20.7 8 21.6 5.6 24.4 5.6C27.4 5.6 29.5 8.8 29.8 14C30 16.8 29.5 19.2 28.6 21.5L24.5 21.5L24.5 26.9A2 2 0 0 1 22.5 28.9L9.5 28.9A2 2 0 0 1 7.5 26.9L7.5 21.5ZM7.5 21.5L24.5 21.5L24.5 22.7L7.5 22.7Z" />
  </g>
</svg>
